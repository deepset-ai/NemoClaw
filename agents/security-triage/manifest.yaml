#
# Agent manifest for Security Triage (deepset Haystack + security-agent-core's
# code-triage skill). Adds a 5th agent runtime, following the deep-research POC's
# manifest-only registration path (§1 of DEEP_RESEARCH_POC_REPORT.md): dropping
# this manifest is enough for `nemoclaw agents list` / `--agent security-triage`
# / direct `openshell sandbox create`. The full `nemoclaw onboard` wizard (the
# `ManagedStartupAgent` union touchpoints) is a deliberately deferred v2 step.
#
# Modeled as a `terminal` runtime, like langchain-deepagents-code and
# deep-research: the triage run is a one-shot `security-triage-agent run --repo
# ...` invocation, not a persistent web UI. The sandbox stays alive via the
# always-up health gateway nemoclaw-start still launches (a harmless liveness
# process); readiness is proven by the smoke command below, not a health probe.

name: security-triage
display_name: "Security Triage Agent"
description: "Whole-repo security scan agent built on deepset Haystack and security-agent-core (run_bash/run_python tools, code-triage skill, host-side security KB)"
version_constraint: ">=3.0.0"
language: python
license: Apache-2.0
homepage: "https://github.com/deepset-ai/security-agent"

# ── Binary & process ────────────────────────────────────────────
install_method: pip
binary_path: /usr/local/bin/security-triage-agent
version_command: "security-triage-agent --version"
expected_version: "0.1.0"
version_scheme: semver

# ── Runtime kind ────────────────────────────────────────────────
runtime:
  kind: terminal
  interactive_command: "bash"
  headless_command: "security-triage-agent run --repo /sandbox/work"
  smoke_commands:
    - "security-triage-agent --version"

# ── Configuration ───────────────────────────────────────────────
config:
  dir: /sandbox/.security-triage
  config_file: config.yaml
  env_file: .env
  format: yaml

# ── State directories ──────────────────────────────────────────
# `run` writes one JSON record per scan (parsed findings, raw answer, full tool trajectory,
# timing) under reports/ so every claim can be checked against the code; an operator-approved
# agent.yaml in the config dir overrides the packaged seed.
state_dirs:
  - state
  - logs
  - reports

user_managed_files:
  - .security-triage/.env

device_pairing: false

# ── Inference ───────────────────────────────────────────────────
# Built on Haystack's OpenAIChatGenerator, which calls the OpenAI-compatible Chat Completions
# API (/v1/chat/completions) via the `openai` SDK. The SDK reads OPENAI_BASE_URL / OPENAI_API_KEY
# when the agent YAML leaves api_base_url unset (start.sh exports both from NemoClaw's managed
# route), so a local vLLM/NIM or any OpenAI-compatible provider selected at onboarding routes
# through with no code changes. The served model name arrives as NEMOCLAW_MODEL.
inference:
  provider_type: openai_compatible
  default_model: nemotron-3.5-lightning
  base_url_config_key: "model.base_url"
  model_config_key: "model.default"
  proxy_support: implicit

# ── MCP server support ───────────────────────────────────────────
mcp:
  support: disabled
  reason: "MCP bridge is out of scope for the Security Triage POC runtime."

# ── Package registry ───────────────────────────────────────────
# No runtime pip installs -- security-agent-core, the code-triage skill, and its
# venv (tree-sitter/bandit) are all baked into the image at build time. This
# stanza is kept for manifest-shape parity with the other agents; nothing at run
# time actually talks to PyPI.
package_registry:
  hosts:
    - pypi.org
    - files.pythonhosted.org
  binary: /opt/venv/bin/pip3
