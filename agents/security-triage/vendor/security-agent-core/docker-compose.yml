# Qdrant: the security knowledge base's document store (`search_security_kb`).
#
#   docker compose up -d qdrant     # start it
#   secagent kb build --profile full
#   docker compose down             # stop it; the corpus survives in the named volume
#
# Pinned to a minor version, not `latest`: a Qdrant upgrade can change scoring internals, and an
# optimize campaign compares iteration scores across days. Bump it deliberately, then rebuild.
#
# Not exposed beyond localhost and no API key: this is a local dev/eval dependency holding public
# feed data. Putting it on a shared host means adding `QDRANT__SERVICE__API_KEY` and dropping the
# host port binding.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: secagent-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST — what KB_QDRANT_URL points at
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # `kb build` on a container that is up but not yet serving fails with a connection error
      # that reads like a misconfiguration, so wait for readiness rather than for the process.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant_storage:
