components:
  agent:
    init_parameters:
      chat_generator:
        init_parameters:
          api_key:
            env_vars:
            - ANTHROPIC_API_KEY
            strict: true
            type: env_var
          generation_kwargs:
            max_tokens: 8192
          ignore_tools_thinking_messages: true
          max_retries: null
          model: claude-sonnet-5
          streaming_callback: null
          timeout: null
          tools: null
        type: haystack_integrations.components.generators.anthropic.chat.chat_generator.AnthropicChatGenerator
      exit_conditions:
      - text
      hooks: null
      max_agent_steps: 4
      raise_on_tool_invocation_failure: false
      required_variables: null
      state_schema: {}
      streaming_callback: null
      system_prompt: "You are a security vulnerability-triage assistant.\n\nYou are\
        \ given a single source-code function. Decide whether it contains a security\
        \ vulnerability, and if so which CWE weakness class it belongs to and which\
        \ lines are implicated.\n\n- Reason about memory safety, input validation,\
        \ injection, and unsafe API usage.\n- To pin down the CWE, you MAY call search_cwe\
        \ with a short description of the weakness to retrieve candidate classes,\
        \ and lookup_cwe to confirm a specific id. Use them when unsure rather than\
        \ guessing a number; skip them for classes you already know, and keep tool\
        \ use to a call or two.\n- Base your verdict only on the code shown. Do not\
        \ assume unseen callers make it safe or unsafe.\n- When you are ready, reply\
        \ with the verdict as JSON and nothing else.\n\nRespond with a single JSON\
        \ object and no surrounding prose or code fences:\n{\n  \"is_vulnerable\"\
        : true | false,\n  \"cwe\": \"CWE-<number>\" | null,     // null when is_vulnerable\
        \ is false\n  \"vulnerable_lines\": [<int>, ...], // 1-based line numbers;\
        \ [] when not vulnerable\n  \"rationale\": \"<one or two sentences>\"\n}\n\
        \nExample verdict for a function that copies unbounded input into a fixed\
        \ stack buffer with strcpy:\n{\"is_vulnerable\": true, \"cwe\": \"CWE-787\"\
        , \"vulnerable_lines\": [3], \"rationale\": \"strcpy copies attacker-controlled\
        \ input into a fixed-size buffer with no bounds check, allowing an out-of-bounds\
        \ write.\"}"
      tool_concurrency_limit: 4
      tool_streaming_callback_passthrough: false
      tools:
      - data:
          component:
            init_parameters:
              reference_path: data/cwe_reference.json
              top_k: 5
            type: security_agent.components.CweSearch
          description: Search the CWE catalog by a short free-text description of
            the weakness (e.g. 'writes past the end of a fixed-size buffer'). Returns
            the top candidate CWE classes with their definitions. Use it to find the
            right CWE id when you do not already know it, then confirm the chosen
            one with lookup_cwe.
          inputs_from_state: null
          name: search_cwe
          outputs_to_state: null
          outputs_to_string:
            source: matches
          parameters: null
        type: haystack.tools.component_tool.ComponentTool
      - data:
          component:
            init_parameters:
              reference_path: data/cwe_reference.json
            type: security_agent.components.CweLookup
          description: Look up the definition of a CWE weakness class by its identifier
            (e.g. 'CWE-787' or '787'). Returns the name and a short description. Use
            it to confirm which weakness class a code pattern belongs to.
          inputs_from_state: null
          name: lookup_cwe
          outputs_to_state: null
          outputs_to_string:
            source: definition
          parameters: null
        type: haystack.tools.component_tool.ComponentTool
      user_prompt: null
    type: haystack.components.agents.agent.Agent
connection_type_validation: true
connections: []
max_runs_per_component: 100
metadata: {}
