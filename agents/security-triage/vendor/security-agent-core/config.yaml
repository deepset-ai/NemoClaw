# Campaign config. The benchmark is the single selector: `--benchmark <name>` (on every command),
# or `default_benchmark` below. Selecting a benchmark selects its block under `benchmarks:` AND all
# of its derived artifact paths — seed (seeds/<name>.yaml), runs store (runs/<name>/), promoted
# pipeline (pipelines/<name>.yaml), meta-agent program (programs/<name>.md). Paths are derived from
# the name, so two benchmarks never overwrite one another and nothing can drift out of sync.
default_benchmark: secbench

# ── Cross-cutting defaults (a benchmark block may override any of these) ──────────────
target:
  approved_models: ["gpt-5.4-mini"]

optimizer:
  meta_model: gpt-5.4
  meta_max_steps: 25
  hitl: false
  allow_create_component: false
  epsilon: 0.02
  iterations: 5

# ── Security knowledge base (benchmark-independent; read by knowledge_base.settings) ──
# Build-side configuration for `secagent kb build`. The QUERY side does not read this file: the
# `search_security_kb` tool carries its own init parameters in seeds/secbench.yaml so the seed
# stays the single source of truth (and stays mutable by the optimizer). `secagent kb build`
# prints the matching seed snippet so the two cannot drift.
#
# `embedding_model` is coupled to the built collection — changing it invalidates every stored
# vector, and `store.check_model` refuses to use a collection built with a different model.
# Every key here can be overridden by an env var (KB_*, NVD_*) or a CLI flag.
knowledge_base:
  # The corpus lives in Qdrant, not on this filesystem: `docker compose up -d qdrant`.
  # Override per invocation with --qdrant-url / KB_QDRANT_URL (tests pass ":memory:").
  qdrant_url: http://localhost:6333
  qdrant_index: security_kb
  cache_dir: data/kb_cache
  profile: full
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_dim: 384
  # bge is asymmetric: the instruction goes on the query side only. A prefix mismatch between
  # index time and query time degrades retrieval badly and silently.
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  # The lexical leg. Qdrant has no BM25 index, so BM25 is encoded as a sparse vector at build
  # time and fused with the dense leg server-side.
  sparse_model: Qdrant/bm25
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # cpu, never null: sentence-transformers would auto-select MPS on macOS, so the same text
  # would embed differently depending on which machine built vs queried the store. KB_DEVICE=mps
  # is a supported build-time speedup; kb_meta.json records which device was used.
  device: cpu
  batch_size: 2000      # documents per indexing-pipeline run (bounds peak RAM at 70k chunks)
  st_batch_size: 64     # sentence-transformers encode batch
  # Chunk budget, must stay under the embedder's 512-token cap (the estimator is chars/4).
  max_chunk_tokens: 480
  preferred_chunk_tokens: 256
  # NVD is the one sizing knob that can explode the corpus: 90 days at CVSS>=7 is ~7.5k chunks,
  # 730 days would alone exceed 60k. Set NVD_API_KEY for a 10x rate limit.
  nvd_lookback_days: 90
  nvd_min_cvss: 7.0
  # Three datasets, all bearing on memory-safety bugs in C/C++. Upstream (redamon) also ships
  # GTFOBins, LOLBAS, OWASP WSTG and Nuclei clients; they are not carried here — see the NOTICE.
  profiles:
    dev:      [cwe]                     # ~1k, fully offline (the CWE reference is committed)
    standard: [cwe, nvd]                # ~8k, + NVD (90 days, CVSS >= 7)
    full:     [cwe, nvd, exploitdb]     # ~55k, + ExploitDB

# ── Per-benchmark overrides (only what differs from the defaults above) ───────────────
benchmarks:
  # PrimeVul: classification (CWE triage). The agent is run once per task by the shared subprocess
  # runner; a tight step budget is enough.
  primevul:
    # PrimeVul's seed is still the Anthropic claude-sonnet-5 target; override the cross-cutting default.
    approved_models: ["claude-sonnet-5"]
    max_agent_steps_range: [1, 8]
    smoke_size: 4
    per_task_timeout: 180
    step_cost_lambda: 0.0

  # SEC-bench: EXECUTION-STYLE. It owns a Docker runner, needs a running Docker daemon, and pulls
  # large per-instance images (start with the tiny curated subset). Tasks are built by
  # `secagent build-benchmark --benchmark secbench` into benchmark_data/secbench.jsonl. The coding
  # agent needs many turns (explore -> edit -> build -> verify); the seed uses 40. A task pulls an
  # image, runs the agent, then builds + repros in Docker — slow.
  secbench:
    max_agent_steps_range: [10, 60]
    smoke_size: 2
    per_task_timeout: 1800
    # Let the meta-agent author new tools for the security agent (create_component). Kept unattended
    # (hitl: false) for the long campaign; safe because generated components stay pure-Python — the
    # check_source denylist blocks fs/network/process, so there is no I/O to gate. NOTE: SEC-bench
    # runs the target agent (and any created component) IN-PROCESS, so the denylist is the sole guard
    # here. If the container-API relaxation is ever enabled, turn hitl back on.
    allow_create_component: true
    hitl: false
    # Resolve rate on a tiny subset is coarse (steps of 1/n); require a clear margin so the loop
    # keeps a candidate only on a real improvement.
    epsilon: 0.02
    # quality - lambda * mean_steps / max_steps; 0 disables the cost regularizer
    step_cost_lambda: 0.0
